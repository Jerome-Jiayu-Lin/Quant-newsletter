[project]
name = "quant-brief"
version = "0.1.0"
description = "Daily quant, AI and useful-tool knowledge card pipeline"
requires-python = ">=3.11"

[project.optional-dependencies]
publication = ["boto3>=1.43.84,<2"]

[project.scripts]
quant-brief = "quantbrief.cli:main"
quant-brief-archive = "quantbrief.archive:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
