name: Daily Quant Brief

on:
  workflow_dispatch:
  schedule:
    - cron: '10 18 * * *'
      timezone: 'Asia/Singapore'

permissions:
  contents: write

concurrency:
  group: daily-quant-brief
  cancel-in-progress: false

jobs:
  build-edition:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Restore rolling Candidate Pool
        uses: actions/cache/restore@v4
        with:
          path: storage/candidates/rolling-candidate-pool.json
          key: quant-brief-candidates-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            quant-brief-candidates-${{ runner.os }}-

      - name: Verify collection pipeline
        run: python -m unittest discover -s tests -v

      - name: Resolve previous Singapore Edition date
        id: edition
        run: echo "date=$(TZ=Asia/Singapore date -d yesterday +%F)" >> "$GITHUB_OUTPUT"

      - name: Fetch, rank and summarize sources
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SUMMARY_PROVIDER: ${{ vars.SUMMARY_PROVIDER || 'auto' }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: gpt-5.6-luna
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DEEPSEEK_MODEL: ${{ vars.DEEPSEEK_MODEL || 'deepseek-v4-flash' }}
          DEEPSEEK_BASE_URL: ${{ vars.DEEPSEEK_BASE_URL || 'https://api.deepseek.com' }}
        run: python -m quantbrief.cli --edition-date "${{ steps.edition.outputs.date }}" --state .github/state/daily-brief-fetch-state.json

      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Build website
        working-directory: web
        run: pnpm install --frozen-lockfile && pnpm build

      - name: Publish today's data to main
        run: |
          git config user.name "quant-brief-bot"
          git config user.email "quant-brief-bot@users.noreply.github.com"
          git add web/data/cards.json .github/state/daily-brief-fetch-state.json
          git diff --cached --quiet && exit 0
          git commit -m "data: publish daily brief"
          git push

      - name: Save rolling Candidate Pool
        uses: actions/cache/save@v4
        with:
          path: storage/candidates/rolling-candidate-pool.json
          key: quant-brief-candidates-${{ runner.os }}-${{ github.run_id }}
