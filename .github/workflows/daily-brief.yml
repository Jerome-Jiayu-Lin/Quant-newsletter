name: Daily Quant Brief

on:
  workflow_dispatch:
  schedule:
    - cron: '10 2 * * *'
      timezone: 'Asia/Singapore'

permissions:
  contents: write

concurrency:
  group: daily-quant-brief
  cancel-in-progress: false

jobs:
  build-edition:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install publication adapter
        run: python -m pip install -e ".[publication]"

      - name: Restore rolling Candidate Pool
        uses: actions/cache/restore@v4
        with:
          path: storage/candidates/rolling-candidate-pool.json
          key: quant-brief-candidates-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            quant-brief-candidates-${{ runner.os }}-

      - name: Verify collection pipeline
        run: python -m unittest discover -s tests -v

      - name: Resolve previous Singapore Edition date
        id: edition
        run: |
          edition_date=$(TZ=Asia/Singapore date -d yesterday +%F)
          echo "date=$edition_date" >> "$GITHUB_OUTPUT"
          echo "snapshot=storage/editions/${edition_date:0:4}/${edition_date:5:2}/$edition_date/quant-brief-edition.json" >> "$GITHUB_OUTPUT"

      - name: Fetch, rank and summarize sources
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SUMMARY_PROVIDER: deepseek
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DEEPSEEK_MODEL: ${{ vars.DEEPSEEK_MODEL || 'deepseek-v4-flash' }}
          DEEPSEEK_BASE_URL: ${{ vars.DEEPSEEK_BASE_URL || 'https://api.deepseek.com' }}
        run: python -m quantbrief.cli --require-ai --edition-date "${{ steps.edition.outputs.date }}" --output "${{ steps.edition.outputs.snapshot }}" --state .github/state/daily-brief-fetch-state.json

      - name: Publish through shared R2 interface
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ vars.R2_BUCKET_NAME || 'jerome-brief-public' }}
        run: python -m quantbrief.publish_cli "${{ steps.edition.outputs.snapshot }}" --deployment-identifier "github:${GITHUB_RUN_ID}:${GITHUB_SHA}"

      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Build website
        working-directory: web
        run: pnpm install --frozen-lockfile && pnpm build

      - name: Commit Fetch State
        run: |
          git config user.name "quant-brief-bot"
          git config user.email "quant-brief-bot@users.noreply.github.com"
          git add .github/state/daily-brief-fetch-state.json
          git diff --cached --quiet && exit 0
          git commit -m "data: publish daily brief"
          git push

      - name: Save rolling Candidate Pool
        uses: actions/cache/save@v4
        with:
          path: storage/candidates/rolling-candidate-pool.json
          key: quant-brief-candidates-${{ runner.os }}-${{ github.run_id }}
